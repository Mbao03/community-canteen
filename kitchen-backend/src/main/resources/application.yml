server:
  port: 9111
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/MealManager}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/${MYSQL_DB_NAME:db_kitchen}?useAffectedRows=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
      enabled: false

  ai:
    openai:

      api-key: ${OPENAI_API_KEY:}

openai:
  api:
    url: ${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
    model: ${OPENAI_MODEL:deepseek-v4-flash}
    connect-timeout-ms: ${OPENAI_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${OPENAI_READ_TIMEOUT_MS:60000}
  proxy:
    host: ${OPENAI_PROXY_HOST:}
    port: ${OPENAI_PROXY_PORT:0}

mybatis:
  mapper-locations: classpath:mapper/*.xml
